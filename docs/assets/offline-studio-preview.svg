<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc">
<title id="title">Offline Studio unified workspace overview</title>
<desc id="desc">Light workspace with Story video, Batch tools and Service settings navigation. The batch view shows sample files, a shared prompt, progress and history. UI illustration with fictional examples, not a live job.</desc>
