<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ComfyUI Workbench</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <aside class="sidebar">
    <a class="brand" href="#batch"><span class="brand-mark">C</span><span>ComfyUI Workbench<small>本地批量工作台</small></span></a>
    <p class="nav-caption">工作区</p>
    <nav aria-label="工作区">
      <button class="nav-item active" data-view="batch" aria-current="page"><span aria-hidden="true">▦</span>批量工具</button>
      <button class="nav-item" data-view="settings"><span aria-hidden="true">⚙</span>ComfyUI 设置</button>
    </nav>
    <div class="sidebar-footer"><span class="local-dot"></span>在本机处理与保存<small>ComfyUI Py Workflow</small></div>
  </aside>
  <div class="workspace">
    <header class="topbar">
      <div>
        <p class="eyebrow" id="view-eyebrow">BATCH TOOLS</p>
        <h1 id="view-title">一次设定，批量完成。</h1>
        <p class="subtitle" id="view-subtitle">批量修改图片，或用首尾帧生成视频。</p>
      </div>
      <button class="offline-badge" id="go-settings"><span></span>ComfyUI <span id="service-summary">检测中</span></button>
    </header>
    <main>
      <div id="view-settings" class="hidden">
        <section class="panel" id="services-panel">
          <div class="section-heading"><div><h2>连接 ComfyUI</h2></div><button class="secondary" id="refresh-services">重新检测</button></div>
          <div class="service-settings">
            <label>ComfyUI 地址<input id="comfy-url" value="http://127.0.0.1:8188"></label>
          </div>
          <div class="status-grid">
            <article class="status-card" id="comfy-status"><strong>ComfyUI</strong><p>尚未检测</p></article>
          </div>
          <p class="hint">Workbench 只连接本机 ComfyUI。更多本地创作工作流请使用独立的 Offline Studio。</p>
        </section>
      </div>
<!-- COMFYUI_BATCH -->
    </main>
    <footer class="page-footer">COMFYUI WORKBENCH <span>批量任务留在本机。</span></footer>
  </div>
  <div id="toast" role="status"></div>
  <script src="/static/comfy.js"></script>
  <script src="/static/batch.js"></script>
</body>
</html>
